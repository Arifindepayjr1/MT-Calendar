<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>TraderLog Trade Chart</title>
    <style>
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101310; }
      body { overscroll-behavior: none; }
      #app { min-height: 300px; }
      #chart { width: 100%; height: 100%; }
      #status { position: absolute; left: 10px; bottom: 28px; z-index: 10; color: #858D86; background: #090D0BDD; font: 10px system-ui,sans-serif; border-radius: 5px; padding: 4px 7px; pointer-events: none; }
      #prototype { position: absolute; top: 8px; left: 8px; z-index: 20; color: #B7F7C4; background: #090D0BDD; border: 1px solid #303832; border-radius: 6px; padding: 5px 8px; font: 10px system-ui,sans-serif; display: none; }
    </style>
    <script type="module" crossorigin src="./chart.js"></script>
  </head>
  <body>
    <div id="app"><div id="chart"></div><div id="status">Waiting for TraderLog…</div><div id="prototype">TRADECANVAS WEBVIEW PROTOTYPE · draw / move / undo / reload</div></div>
    <script>
      if (window.parent !== window) {
        window.TraderLogChartBridge = {
          postMessage: function (message) {
            window.parent.postMessage(message, location.origin);
          },
        };
      }
    </script>
  </body>
</html>
